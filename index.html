<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="An interactive historical atlas of a century of urban mobility in Minneapolis and Rotterdam. Concept prototype: 31 site records, 4 with verified sources." />
    <title>Cycling Cities Tool 2: The Digital Experience</title>
    <link rel="canonical" href="https://cycling-cities-platform.vercel.app/" />
    <meta name="theme-color" content="#F1EFE9" />
    <!-- Prototype: keep it out of search results while the research team reviews it.
         This does not affect link previews, which read the og: tags below. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- icons -->
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />

    <!-- share card: 1200x630, rebuilt from assets/og-card.source.html -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cycling Cities" />
    <meta property="og:url" content="https://cycling-cities-platform.vercel.app/" />
    <meta property="og:title" content="Cycling Cities Tool 2: The Digital Experience" />
    <meta property="og:description" content="An interactive historical atlas of a century of urban mobility in Minneapolis and Rotterdam. Concept prototype: 31 site records, 4 with verified sources." />
    <meta property="og:image" content="https://cycling-cities-platform.vercel.app/assets/og-cycling-cities.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cycling Cities Tool 2: The Digital Experience. Minneapolis / Rotterdam, 1890-2020. Concept prototype: 31 site records, 4 with verified sources." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_TW" />
    <meta property="og:locale:alternate" content="nl_NL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cycling Cities Tool 2: The Digital Experience" />
    <meta name="twitter:description" content="An interactive historical atlas of a century of urban mobility in Minneapolis and Rotterdam. Concept prototype: 31 site records, 4 with verified sources." />
    <meta name="twitter:image" content="https://cycling-cities-platform.vercel.app/assets/og-cycling-cities.png" />
    <meta name="twitter:image:alt" content="Cycling Cities Tool 2: The Digital Experience. Minneapolis / Rotterdam, 1890-2020. Concept prototype: 31 site records, 4 with verified sources." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="grain">

    <header class="topbar">
      <a class="brand" href="./" aria-label="Cycling Cities">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 38 38"><circle cx="11" cy="26" r="6.5"/><circle cx="28" cy="26" r="6.5"/><path d="M11 26l6-13 5 13m-11 0h11l6-12h-8l8 12M15 9h5"/></svg>
        </span>
        <span><b>Cycling Cities</b><small id="brandSub"></small></span>
      </a>

      <nav class="primary-nav" aria-label="Sections">
        <button class="nav-item active" data-view="map"></button>
        <button class="nav-item" data-view="compare"></button>
        <button class="nav-item" data-view="stories"></button>
        <button class="nav-item" data-view="method"></button>
      </nav>

      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" type="button">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        </button>
        <button class="contribute-btn" id="contribBtn" type="button">
          <span></span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button class="icon-btn menu-btn" id="menuBtn" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </header>

    <div id="map"></div>
    <div id="loadError" role="alert"></div>
    <div id="divider"><span class="lbl l" id="dvL"></span><span class="lbl r" id="dvR"></span></div>

    <div class="map-tools">
      <button class="icon-btn" id="zoomIn" type="button" aria-label="Zoom in">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="zoomOut" type="button" aria-label="Zoom out">
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="fitBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div class="prototype-notice" id="notice" role="note">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
      <p><b id="noticeTitle"></b><span id="noticeBody"></span>
        <button type="button" id="noticeLink" class="notice-link"></button></p>
      <button type="button" id="noticeClose">&times;</button>
    </div>

    <div class="map-bottom-left">
      <div class="map-legend" id="mapLegend"></div>
      <div class="map-title-card">
        <span class="map-kicker" id="mapKicker"></span>
        <div class="map-title-line"><h2 id="mapTitle"></h2><span id="mapYear"></span></div>
        <p id="mapSub"></p>
      </div>
    </div>

    <div class="panel" id="panel">
      <div class="sheet-head" id="sheetHead">
        <button class="sheet-grip" id="sheetGrip" type="button"><span></span></button>
        <div class="sheet-context" id="sheetContext"></div>
        <div class="sheet-slot" id="sheetSlot"></div>
      </div>
      <div class="panel-body" id="panelBody">
      <div class="panel-head">
        <div class="lang-switch" id="langSwitch"></div>
        <div class="head-en" id="headEyebrow"></div>
        <div class="head-zh" id="headTitle"></div>
        <div class="head-meta" id="headMeta"></div>
      </div>
      <div class="nav-slot" id="navSlot"></div>

      <div class="section-label" id="sl1"><span class="num">01</span><span class="txt"></span><span class="en"></span></div>
      <div class="city-row">
        <button class="city-chip active" data-city="mpls"></button>
        <button class="swap-btn" id="swapBtn" type="button">
          <svg viewBox="0 0 24 24"><path d="m8 7-3 3 3 3M5 10h13M16 17l3-3-3-3M19 14H6"/></svg>
        </button>
        <button class="city-chip" data-city="rdam"></button>
      </div>
      <button class="btn" id="compareBtn" type="button">
        <span class="dot"></span><span><span class="t"></span><span class="sub"></span></span>
      </button>
      <button class="btn" id="globalBtn" type="button">
        <span class="dot"></span><span class="t"></span><span class="en"></span>
      </button>

      <div class="section-label" id="sl2"><span class="num">02</span><span class="txt"></span><span class="en"></span></div>
      <div id="decadeHome"></div>
      <div id="decadeBlock">
        <div class="year-display">
          <div class="year-big" id="yearBig">1890</div>
          <div class="year-era" id="yearEra"></div>
          <button class="play-btn" id="playBtn" type="button">
            <svg class="play-icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
        </div>
        <input type="range" id="yearRange" min="0" max="13" step="1" value="0" aria-label="Decade" />
        <div class="year-ticks" id="yearTicks"></div>
        <p class="axis-now" id="axisNow"></p>
      </div>

      <div class="section-label" id="sl3"><span class="num">03</span><span class="txt"></span><span class="en"></span></div>
      <button class="btn" id="histBtn" type="button"><span class="dot"></span><span class="t"></span><span class="en"></span></button>
      <button class="btn" id="swipeBtn" type="button" disabled><span class="dot"></span><span class="t"></span><span class="en"></span></button>
      <div class="opa-row">
        <span class="lbl" id="opaLbl"></span>
        <input type="range" id="histOpa" min="20" max="100" step="5" value="85" aria-label="Overlay opacity" />
        <span class="val" id="histOpaVal">85%</span>
      </div>
      <div class="hist-status" id="histStatus"></div>

      <div class="section-label" id="sl4"><span class="num">04</span><span class="txt"></span><span class="en"></span><button class="act" id="allFactors" type="button"></button></div>
      <div id="factors"></div>

      <div class="section-label" id="sl5"><span class="num">05</span><span class="txt"></span><span class="en"></span></div>
      <div class="split-wrap">
        <svg id="splitChart" viewBox="0 0 300 96" preserveAspectRatio="none" style="width:100%;height:96px;display:block"></svg>
        <div class="split-legend" id="splitLegend"></div>
        <div class="split-note" id="splitNote"></div>
        <div class="split-caption" id="splitCaption"></div>
      </div>

      <div class="section-label" id="sl6"><span class="num">06</span><span class="txt"></span><span class="en"></span></div>
      <div class="record" id="record"></div>
      <button class="rec-more" id="sourcesBtn" type="button"></button>
      <button class="rec-more" id="statusBtn" type="button"></button>

      <div class="section-label" id="sl7"><span class="num">07</span><span class="txt"></span><span class="en"></span></div>
      <div class="base-pills">
        <button class="base-pill active" data-base="light"></button>
        <button class="base-pill" data-base="plain"></button>
        <button class="base-pill" data-base="voyager"></button>
      </div>

      <div class="panel-actions">
        <button type="button" id="shareBtn">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.5-4.5M8.2 13.2l7.5 4.5"/></svg>
          <span></span>
        </button>
        <button type="button" id="citeBtn">
          <svg viewBox="0 0 24 24"><path d="M7 17h3l2-4V7H6v6h3M15 17h3l2-4V7h-6v6h3"/></svg>
          <span></span>
        </button>
      </div>

      <div class="panel-foot">
        <span id="footText"></span>
        <div class="flagline" id="flagText"></div>
      </div>
      </div>
    </div>

    <div class="drawer-backdrop" data-close-drawer></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <span class="eyebrow" id="drawerEyebrow"></span>
        <button type="button" data-close-drawer aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>

    <dialog class="search-dialog" id="searchDialog">
      <div class="dialog-shell">
        <div class="search-field">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input type="search" id="searchInput" />
          <button type="button" id="searchClose">ESC</button>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
    </dialog>

    <dialog class="contribute-dialog" id="contribDialog">
      <div class="contribute-shell">
        <button class="dialog-close" id="contribClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <span class="eyebrow" id="contribEyebrow"></span>
        <h2 id="contribTitle"></h2>
        <p id="contribBody"></p>
        <div class="contribute-options" id="contribOptions"></div>
        <p class="contribute-note" id="contribNote"></p>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://yunching0513.github.io/Netherlands-historical-map/vendor/pmtiles.js"></script>
    <script src="./i18n.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
